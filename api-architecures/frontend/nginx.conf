server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React SPA with HTML5 history routing support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Spring Boot backend service
    location /api/ {
        proxy_pass http://backend-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Swagger UI requests to Spring Boot backend
    location /swagger-ui/ {
        proxy_pass http://backend-api:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /swagger-ui.html {
        proxy_pass http://backend-api:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend-api:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
